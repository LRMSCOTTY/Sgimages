[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"
  # ffmpeg-static has a large native binary; exclude it since we don't use ffmpeg on Netlify
  external_node_modules = ["ffmpeg-static", "fluent-ffmpeg"]

# SPA fallback — must be last
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
